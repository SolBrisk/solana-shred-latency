[package]
name = "solana-shred-latency"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Compare raw Solana shred arrival times from multiple UDP feeds"
license = "MIT"
homepage = "https://solbrisk.com"
readme = "README.md"
keywords = ["solana", "shred", "udp", "latency", "benchmark"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"

[profile.release]
lto = "thin"
strip = true
